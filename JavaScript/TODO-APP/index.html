<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TO-DO List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="todo-container">
        
        <h1>My To-Do List</h1>

        <form id="todoForm">

            <input 
                type="text"
                id="todoInput"
                placeholder="Enter a task...."
            >

            <button type="submit">
                Add Task
            </button>
        </form>

        <ul id="todoList"></ul>
    </main>

    <script src="script.js"></script>

</body>
</html>
