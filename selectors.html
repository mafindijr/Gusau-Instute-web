<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning about div and css seletors</title>
    <style>
        /*id selector*/
        #container {
            width: 400px;
            height: 400px;
            border: solid black;
            padding: 20px 30px;
            margin: 50px;
            border-radius: 8px 0px;
            /* padding-top: 50px;
            padding-left: 50px; */
        }

        /*class selector*/
        .head-text {
            color: blue;
        }
        
        /*element selector*/
        p {
            font-size: 25px;
        }

        /*decendant selctor*/
        div button {
            background-color: #000;
            width: 100%;
            color: white;
            border: none;
            padding: 10px 30px;
        }

        /*pseudo selector*/
        button:hover {
            cursor: pointer;
            background: blue;
        }

    </style>
</head>
<body>
    <div id="container">
        <center>
            <h1 class="head-text">HTML</h1>
            <p>Is use for webpage structure</p>
            <button>Learn more</button>
        </center>
    </div>
</body>
</html>
